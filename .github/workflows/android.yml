name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GraalVM Community JDK 17.0.7 (native-image included)
        run: |
          cd "$RUNNER_TEMP"
          wget -q https://github.com/graalvm/graalvm-ce-builds/releases/download/jdk-17.0.7/graalvm-community-jdk-17.0.7_linux-x64_bin.tar.gz -O graalvm.tar.gz
          tar -xzf graalvm.tar.gz
          rm graalvm.tar.gz
          GRAAL_DIR=$(ls -d /opt/graalvm-community-openjdk-17.0.7* 2>/dev/null || true)
          if [ -z "$GRAAL_DIR" ]; then
            sudo mv "$RUNNER_TEMP"/graalvm-community-openjdk-17.0.7* /opt/
            GRAAL_DIR=$(ls -d /opt/graalvm-community-openjdk-17.0.7* | head -n1)
          fi
          mkdir -p "$GRAAL_DIR/bin"
          echo "GRAALVM_HOME=$GRAAL_DIR" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$GRAAL_DIR" >> "$GITHUB_ENV"
          echo "$GRAAL_DIR/bin" >> "$GITHUB_PATH"
      - name: Verify GraalVM
        run: |
          java -version 2>&1
          which native-image
          native-image --version

      - name: Prepare Android SDK (platform, build-tools, NDK 25)
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

      - name: Build APK (GluonFX native image)
        run: mvn -B -Pandroid gluonfx:build gluonfx:package

      - name: Stage APK
        run: |
          mkdir -p release
          find target/gluonfx -name '*.apk' -exec cp {} release/ \;
          ls -la release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snake3D-APK
          path: release/*.apk
          if-no-files-found: error

      - name: "Publish APK to GitHub Release (tag apk)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Snake3D APK" --notes "Automated Snake3D Android APK build"
          gh release upload apk release/*.apk --clobber
