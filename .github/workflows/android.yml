name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Gluon GraalVM 22.1.0.1 (required by gluonfx)
        run: |
          cd "$RUNNER_TEMP"
          wget -q https://github.com/gluonhq/graal/releases/download/gluon-22.1.0.1-Final/graalvm-svm-java17-linux-gluon-22.1.0.1-Final.tar.gz -O gluon-graalvm.tar.gz
          tar -xzf gluon-graalvm.tar.gz
          rm gluon-graalvm.tar.gz
          NI=$(find "$RUNNER_TEMP" -type f -name native-image | head -n1)
          if [ -z "$NI" ]; then echo "native-image not found in tarball"; exit 1; fi
          GRAAL_DIR=$(cd "$(dirname "$NI")/.." && pwd)
          echo "Graal dir: $GRAAL_DIR"
          echo "GRAALVM_HOME=$GRAAL_DIR" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$GRAAL_DIR" >> "$GITHUB_ENV"
          echo "$GRAAL_DIR/bin" >> "$GITHUB_PATH"
      - name: Verify GraalVM
        run: |
          java -version 2>&1
          native-image --version

      - name: Prepare Android SDK (platform, build-tools, NDK 25)
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

      - name: Build APK (GluonFX native image)
        run: mvn -B -Pandroid gluonfx:build gluonfx:package

      - name: Stage APK
        run: |
          mkdir -p release
          find target/gluonfx -name '*.apk' -exec cp {} release/ \;
          ls -la release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snake3D-APK
          path: release/*.apk
          if-no-files-found: error

      - name: "Publish APK to GitHub Release (tag apk)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Snake3D APK" --notes "Automated Snake3D Android APK build"
          gh release upload apk release/*.apk --clobber
